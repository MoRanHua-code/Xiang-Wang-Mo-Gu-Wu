<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小H快跑 - 向往的生活</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #87CEEB;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #gameCanvas {
            display: block;
            margin: 0 auto;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.6);
            color: white;
            font-family: 'Courier New', monospace;
            z-index: 10;
        }
        #gameOverScreen {
            display: none;
        }
        .title {
            font-size: 2.5em;
            color: #FFD700;
            text-shadow: 3px 3px 0 #8B4513, -1px -1px 0 #8B4513;
            margin-bottom: 20px;
            animation: bounce 0.6s ease-in-out infinite alternate;
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        .subtitle {
            font-size: 1.2em;
            color: #FFF;
            margin-bottom: 30px;
        }
        .btn {
            padding: 15px 40px;
            font-size: 1.3em;
            background: linear-gradient(180deg, #FF6B6B, #EE5A5A);
            border: 4px solid #8B4513;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-shadow: 2px 2px 0 #8B4513;
            box-shadow: 0 4px 0 #8B4513;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #8B4513;
        }
        .instructions {
            margin-top: 30px;
            font-size: 0.9em;
            color: #CCC;
            text-align: center;
            line-height: 1.6;
        }
        .stats {
            font-size: 1.5em;
            margin: 15px 0;
            color: #FFD700;
        }
        .hint {
            font-size: 1em;
            color: #AAA;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>


    <!--    背景音乐-->
    <!-- 隐藏音频元素，不要 controls -->
    <audio id="bgm" loop >
        <source src="music/《西双版纳雨林的灵动之舞》LUCK_地锅鸡.m4a" >

    </audio>

    <!-- 收集音效 -->
    <audio id="collectSound" preload="auto">
        <source src="music/collect.mp3" type="audio/mpeg">
        <!-- 备用格式 -->
        <source src="music/collect.ogg" type="audio/ogg">
    </audio>


    <button id="pauseBtn" style="position: absolute;
    top: 10px; right: 10px; z-index: 20;
    padding: 8px 16px; font-size: 14px; background: rgba(0,0,0,0.5);
    color: white; border: 2px solid white; border-radius: 5px; cursor: pointer; display: none;">暂停</button>


    <div id="startScreen">
        <div class="title">🐕 小H快跑 🐕</div>
        <div class="subtitle">向往的生活 · 蘑菇屋大冒险</div>
        <button class="btn" id="startBtn">开始游戏</button>

        <!-- 新增设置按钮 -->
        <button class="btn" id="settingsBtn" style="margin-top: 15px; background: linear-gradient(180deg, #4CAF50, #45a049); font-size: 1em; padding: 10px 30px;">⚙️ 设置</button>
        <button class="btn" id="backToCourtyardBtn" style="margin-top: 15px; background: linear-gradient(180deg, #8B7355, #6B5A3A); font-size: 1em; padding: 10px 30px;">🌳 返回庭院</button>
        <div class="instructions">
            👆 点击屏幕上半部分 = 跳跃<br>

               收集风车 +50分<br>
            🐔 躲避障碍物！
        </div>
    </div>>
    </div>

    <!-- 设置界面 -->
    <div id="settingsScreen" style="display: none; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.7); color: white; font-family: 'Courier New', monospace; z-index: 15;">
        <div class="title">⚙️ 设置</div>

        <div style="margin: 20px 0; text-align: center;">
            <div style="margin: 15px 0; font-size: 1.2em;">
                <span>🎵 背景音乐</span>
                <button id="bgmToggle" class="btn" style="margin-left: 20px; padding: 8px 20px; font-size: 0.9em;">开启</button>
            </div>
            <div style="margin: 15px 0; font-size: 1.2em;">
                <span>🔊 音效</span>
                <button id="sfxToggle" class="btn" style="margin-left: 20px; padding: 8px 20px; font-size: 0.9em;">开启</button>
            </div>
        </div>
        <button class="btn" id="backBtn" style="margin-top: 30px;">返回</button>
    </div>


    
    <div id="gameOverScreen">
        <div class="title">游戏结束</div>
        <div class="stats" id="finalScore">距离: 0m</div>
        <div class="stats" id="boneCount">骨头: 0</div>
        <div class="stats" id="ingredientCount">食材: 0</div>
        <button class="btn" id="restartBtn">再来一次</button>
        <div class="hint">点击屏幕或按空格键</div>
    </div>

    <script>
    (function() {
        'use strict';
        
        // ===== 画布设置 =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        // 获取背景音乐元素 ← 加这行
        const bgm = document.getElementById('bgm');

        //收集音效
        const collectSound = document.getElementById('collectSound');
        // 竖屏9:16比例
        const GAME_WIDTH = 360;
        const GAME_HEIGHT = 640;
        const GROUND_Y = GAME_HEIGHT - 100;
        
        let scale = 1;
        let offsetX = 0;
        // ===== 音频设置 =====
        let bgmEnabled = true;   // 背景音乐开关
        let sfxEnabled = true;   // 音效开关
        
        function resizeCanvas() {
            const windowRatio = window.innerWidth / window.innerHeight;
            const gameRatio = GAME_WIDTH / GAME_HEIGHT;
            
            if (windowRatio > gameRatio) {
                canvas.height = window.innerHeight;
                canvas.width = canvas.height * gameRatio;
            } else {
                canvas.width = window.innerWidth;
                canvas.height = canvas.width / gameRatio;
            }
            
            scale = canvas.width / GAME_WIDTH;
            offsetX = 0;
            
            canvas.style.width = canvas.width + 'px';
            canvas.style.height = canvas.height + 'px';
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // ===== 游戏状态 =====
        const GameState = { START: 0, PLAYING: 1, PAUSED: 2, GAME_OVER: 3 };
        let gameState = GameState.START;
        
        // ===== 游戏变量 =====
        let player, obstacles, collectibles, particles;
        // 添加常量：小H的地面站立Y坐标
        const PLAYER_GROUND_OFFSET = 45;  // ← 你调整的这个值
        let distance, boneCount, ingredientCount;
        let gameSpeed, baseSpeed;
        let groundOffset, bgOffset1, bgOffset2, bgOffset3;
        let lastObstacleTime, minObstacleGap;
        let frameCount;
        let isDucking = false;
        let deathAnimFrame = 0;
        let isDead = false;
        
        // ===== 颜色配置 =====
        const COLORS = {
            sky: '#87CEEB',
            skyGradientTop: '#5BA3C6',
            skyGradientBottom: '#B0E0E6',
            sun: '#FFE066',
            sunGlow: '#FFFACD',
            mountain1: '#6B8E6B',
            mountain2: '#8FBC8F',
            mountain3: '#90EE90',
            hill: '#7CCD7C',
            ground: '#8B7355',
            grass: '#228B22',
            grassLight: '#32CD32',
            mushroomHouse: '#DEB887',
            roof: '#8B4513',
            window: '#87CEEB',
            door: '#A0522D',
            playerBody: '#E8A849',
            playerLight: '#F5C36A',
            playerDark: '#C4852A',
            playerNose: '#2C1810',
            playerEye: '#2C1810',
            bone: '#FFFAF0',
            boneShadow: '#DDD8C4',
            chicken: '#FFFAF0',
            chickenBeak: '#FF8C00',
            chickenComb: '#FF4444',
            chickenLeg: '#FF8C00',
            corn: '#FFD700',
            cornLeaf: '#228B22',
            cornStalk: '#228B22',
            puddle: '#4682B4',
            puddleHighlight: '#6495ED',
            basket: '#D2691E',
            basketWeave: '#8B4513',
            goose: '#F5F5F5',
            gooseBeak: '#FF8C00',
            gooseNeck: '#E8E8E8',
            tomato: '#FF6347',
            tomatoStem: '#228B22',
            pepper: '#FF4500',
            pepperStem: '#228B22',
            fish: '#4682B8',
            fishBelly: '#B0C4DE',
            floatText: '#FFD700',
            cloud: 'rgba(255,255,255,0.9)'
        };
        
        // ===== 初始化游戏 =====

        const PLAYER_GROUND_Y = GROUND_Y - 45;  // ← 小H的地面站立位置

        function initGame() {
            player = {
                x: 80,
                y: GROUND_Y - PLAYER_GROUND_OFFSET,   // 将y轴位置用常量
                width: 50,
                height: 60,
                velocityY: 0,
                isJumping: false,
                isDucking: false,
                runFrame: 0,
                frameTimer: 0
            };
            
            obstacles = [];
            collectibles = [];
            particles = [];
            distance = 0;
            boneCount = 0;
            ingredientCount = 0;
            baseSpeed = 1.2;        // 基础速度调慢,高了会飞起来
            gameSpeed = baseSpeed;
            groundOffset = 0;
            bgOffset1 = 0;
            bgOffset2 = 0;
            bgOffset3 = 0;

            // ← 添加这两行重置背景状态
            bgOffset = 0;
            currentBgIndex = 0;


            lastObstacleTime = 0;
            minObstacleGap = 1500;
            frameCount = 0;
            isDucking = false;
            deathAnimFrame = 0;
            isDead = false;
        }

        // ===== 定义动画图片资源加载路径 =====
        const RUN_PATH = 'donghua/runright/';           //向右跑的素材路径
        const JUMP_PATH = 'donghua/jump/';         //跳跃的素材路径
        const IDLE_PATH = 'donghua/jinglintu/';  // // 待机素材路径（根据你复制后的位置调整）
        const DEAD_PATH = 'donghua/dead/';   // ← 坠机动画
        const dogAnimations = {
            run: [],
            jump: [],
            texture: null,   // 待机精灵图（大图）
            dead: []   // ← 新增
        };


        // 收集物素材配置（方便后续扩展）
        const collectibleAssets = {
            fengche: null   // 风车
        };

        // 障碍物素材配置
        const OBSTACLE_PATH = 'donghua/obstacle/';

        const obstacleAnimations = {
            peacock: [],   // 孔雀 001-027（天上）
            duck: []       // 鸭子 001-016（地上）
        };



        // ===== 背景素材配置 =====
        const bgConfig = [
            { name: 'changcheng', path: 'donghua/bg/001.jpg', distance: 0 },
            { name: 'helingcun', path: 'donghua/bg/002.jpg', distance: 200},
            { name: 'jiuzhaigou', path: 'donghua/bg/003.jpg', distance: 390 },
            { name: 'tiananmen', path: 'donghua/bg/004.jpg', distance: 480 }
        ];
        const bgAssets = {};
        let currentBgIndex = 0;
        let bgOffset = 0;  // 只有这一个偏移量，全局滚动
        let nextBgIndex = 0;
        let bgTransition = 0;


        let assetsLoaded = false;

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => {
                    console.error('加载失败:', src);
                    reject();
                };
                img.src = src;
            });
        }

        async function loadDogAssets() {
            const promises = [];

            // 加载跑步帧 001.png ~ 007.png
            for (let i = 1; i <= 7; i++) {
                const num = i.toString().padStart(3, '0');
                const p = loadImage(`${RUN_PATH}${num}.png`).then(img => {
                    dogAnimations.run.push(img);
                }).catch(() => {});
                promises.push(p);
            }

            // 加载跳跃帧 001.png ~ 014.png
            for (let i = 1; i <= 14; i++) {
                const num = i.toString().padStart(3, '0');
                const p = loadImage(`${JUMP_PATH}${num}.png`).then(img => {
                    dogAnimations.jump.push(img);
                }).catch(() => {});
                promises.push(p);
            }
            // 加载待机精灵图
            promises.push(
                loadImage(`${IDLE_PATH}texture.png`).then(img => {  // ← 文件名是 texture.png
                    dogAnimations.idle = img;
                }).catch(() => {})
            );

            // 加载晕倒帧 009.png ~ 051.png（共43帧，跳过前8帧）
            for (let i = 9; i <= 51; i++) {
                const num = i.toString().padStart(3, '0');
                const p = loadImage(`${DEAD_PATH}${num}.png`).then(img => {
                    dogAnimations.dead.push(img);
                }).catch(() => {});
                promises.push(p);
            }

            // 加载风车收集物
            promises.push(
                loadImage('donghua/collectible/风车png.png').then(img => {
                    collectibleAssets.fengche = img;
                }).catch(() => {
                })
            );

            // ===== 加载背景素材（新增）=====
            for (const bg of bgConfig) {
                const p = loadImage(bg.path).then(img => {
                    bgAssets[bg.name] = img;
                }).catch(() => {});
                promises.push(p);
            }

            // 加载孔雀帧 001.png ~ 027.png
            for (let i = 1; i <= 27; i++) {
                const num = i.toString().padStart(3, '0');
                const p = loadImage(`${OBSTACLE_PATH}peacock/${num}.png`).then(img => {
                    obstacleAnimations.peacock.push(img);
                }).catch(() => {});
                promises.push(p);
            }

            // 加载鸭子帧 001.png ~ 016.png
            for (let i = 1; i <= 16; i++) {
                const num = i.toString().padStart(3, '0');
                const p = loadImage(`${OBSTACLE_PATH}duck/${num}.png`).then(img => {
                    obstacleAnimations.duck.push(img);
                }).catch(() => {});
                promises.push(p);
            }




            await Promise.all(promises);
            assetsLoaded = true;
            console.log('素材加载完成，跑步:', dogAnimations.run.length, '跳跃:', dogAnimations.jump.length, '待机:', dogAnimations.idle ? '有' : '无', '晕倒:', dogAnimations.dead.length, '背景:', Object.keys(bgAssets));
        }

        loadDogAssets();



        // ===== 绘制像素风柴犬 =====
        function drawPixelDog(x, y, width, height, frame, ducking, dead) {
            const scaleX = width / 50;
            const scaleY = height / 60;

            ctx.save();
            ctx.translate(x, y);

            if (dead) {
                // 死亡时翻转摔倒
                ctx.translate(width/2, height/2);
                ctx.rotate(Math.PI/2);
                ctx.translate(-width/2, -height/2);
            }

            const s = 2; // 像素大小

            // 身体
            ctx.fillStyle = COLORS.playerBody;
            if (ducking) {
                // 滑铲姿势 - 压扁身体
                drawPixelRect(5*s, 8*s, 18*s, 12*s, s);
                drawPixelRect(3*s, 10*s, 4*s, 8*s, s);
                drawPixelRect(19*s, 10*s, 6*s, 8*s, s);
            } else {
                // 站立/跑步姿势
                drawPixelRect(10*s, 10*s, 20*s, 18*s, s);
                // 前腿
                const legOffset = Math.sin(frame * 0.5) * 3;
                drawPixelRect(8*s, 26*s + legOffset, 6*s, 14*s, s);
                drawPixelRect(22*s, 26*s - legOffset, 6*s, 14*s, s);
            }

            // 头部
            ctx.fillStyle = COLORS.playerBody;
            if (ducking) {
                drawPixelRect(20*s, 2*s, 16*s, 12*s, s);
            } else {
                drawPixelRect(18*s, 0, 18*s, 14*s, s);
            }

            // 耳朵
            ctx.fillStyle = COLORS.playerDark;
            if (ducking) {
                drawPixelRect(20*s, -2*s, 5*s, 5*s, s);
                drawPixelRect(30*s, -2*s, 5*s, 5*s, s);
            } else {
                drawPixelRect(18*s, -3*s, 5*s, 6*s, s);
                drawPixelRect(32*s, -3*s, 5*s, 6*s, s);
            }

            // 脸部（浅色）
            ctx.fillStyle = COLORS.playerLight;
            if (ducking) {
                drawPixelRect(22*s, 5*s, 12*s, 6*s, s);
            } else {
                drawPixelRect(20*s, 3*s, 14*s, 8*s, s);
            }

            // 眼睛
            ctx.fillStyle = COLORS.playerEye;
            if (ducking) {
                drawPixelRect(26*s, 5*s, 3*s, 3*s, s);
                drawPixelRect(31*s, 5*s, 3*s, 3*s, s);
            } else {
                drawPixelRect(23*s, 3*s, 3*s, 3*s, s);
                drawPixelRect(30*s, 3*s, 3*s, 3*s, s);
                // 眼睛高光
                ctx.fillStyle = '#FFFFFF';
                drawPixelRect(23*s, 3*s, 1*s, 1*s, s);
                drawPixelRect(30*s, 3*s, 1*s, 1*s, s);
            }

            // 鼻子
            ctx.fillStyle = COLORS.playerNose;
            if (ducking) {
                drawPixelRect(35*s, 7*s, 4*s, 3*s, s);
                drawPixelRect(35*s, 10*s, 4*s, 1*s, s);
            } else {
                drawPixelRect(33*s, 8*s, 4*s, 3*s, s);
                drawPixelRect(33*s, 11*s, 4*s, 1*s, s);
            }

            // 舌头（跑步时）
            if (!ducking && !dead && frame % 20 < 10) {
                ctx.fillStyle = '#FF6B6B';
                drawPixelRect(33*s, 12*s, 3*s, 4*s, s);
            }

            // 尾巴
            ctx.fillStyle = COLORS.playerBody;
            const tailWag = Math.sin(frame * 0.8) * 2;
            if (ducking) {
                drawPixelRect(2*s, 8*s, 4*s, 6*s, s);
            } else {
                drawPixelRect(2*s, 8*s + tailWag, 5*s, 8*s, s);
            }

            ctx.restore();
        }
        // 已有动画素材，可注释掉绘制柴犬


        
        function drawPixelRect(x, y, w, h, s) {
            ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
        }


        // ===== 绘制小H（全素材版）=====
        function drawAnimatedDog(x, y, width, height, frame, ducking, dead) {
            if (!assetsLoaded) return;

            let img = null;
            let needFlip = false;  // 是否需要水平翻转

            if (dead) {
                // 晕倒动画：43帧（009~051），播放一次不循环
                // deathAnimFrame 从 0 开始，但实际素材从第9张开始
                // 所以映射：0→0, 1→1, ... 前8帧用第9张素材（即数组索引0）
                const frameIndex = Math.min(Math.floor(deathAnimFrame / 2), dogAnimations.dead.length - 1);
                img = dogAnimations.dead[frameIndex];
                needFlip = true;
            } else if (gameState === GameState.START) {
                // 待机动画：6帧循环
                if (!dogAnimations.idle) return;
                const idleFrame = Math.floor(frame / 8) % 6;
                const cols = 3;
                const rows = 2;
                const frameW = dogAnimations.idle.width / cols;
                const frameH = dogAnimations.idle.height / rows;
                const col = idleFrame % cols;
                const row = Math.floor(idleFrame / cols);

                ctx.save();
                ctx.translate(x + width, y);
                ctx.scale(-1, 1);  // 待机素材向左，翻转向右
                ctx.drawImage(dogAnimations.idle, col * frameW, row * frameH, frameW, frameH, 0, 0, width, height);
                ctx.restore();
                return;
            } else if (ducking) {
                // 滑铲：暂时用跑步第一帧代替（如果有滑铲素材再改）
                img = dogAnimations.run[0];
            } else if (player.isJumping) {
                // 跳跃：14帧循环
                const frameIndex = Math.floor(frame / 4) % dogAnimations.jump.length;
                img = dogAnimations.jump[frameIndex];
                needFlip = true;  // 跳跃素材向左，需要翻转
            } else {
                // 跑步：7帧循环
                const frameIndex = Math.floor(frame / 6) % dogAnimations.run.length;
                img = dogAnimations.run[frameIndex];
            }

            if (!img) return;

            if (needFlip) {
                ctx.save();
                ctx.translate(x + width, y);
                ctx.scale(-1, 1);
                ctx.drawImage(img, 0, 0, width, height);
                ctx.restore();
            } else {
                ctx.drawImage(img, x, y, width, height);
            }
        }


// ===== 在全局变量区添加 =====
        let bgCycleCount = 0;  // 记录循环次数，用于计算虚拟距离
// ===== 绘制背景（循环版）=====
        function drawBackground() {
            // 计算当前应该显示第几张背景（支持循环）
            let targetIndex = 0;

            // 🔄 循环逻辑：计算虚拟距离（用于背景切换判断）
            const lastBgStart = bgConfig[bgConfig.length - 1].distance; // 450
            const lastBgDuration = 120;
            const cycleLength = lastBgStart + lastBgDuration; // 570

            // 用虚拟距离判断当前该显示哪张背景
            const virtualDistance = distance % cycleLength;

            // 根据虚拟距离找到对应的背景
            for (let i = bgConfig.length - 1; i >= 0; i--) {
                if (virtualDistance >= bgConfig[i].distance) {
                    targetIndex = i;
                    break;
                }
            }

            // 限制最大索引（保险）
            targetIndex = Math.min(targetIndex, bgConfig.length - 1);

            // 切换背景时重置偏移（只在真正切换时重置）
            if (targetIndex !== currentBgIndex) {
                console.log(`切换背景到: ${bgConfig[targetIndex].name}, 实际距离: ${Math.floor(distance)}m, 虚拟距离: ${Math.floor(virtualDistance)}m`);
                currentBgIndex = targetIndex;
                bgOffset = 0; // 新背景从头开始滚动
            }

            // 绘制当前背景
            const currentBg = bgAssets[bgConfig[currentBgIndex]?.name];
            if (currentBg) {
                drawScrollingBg(currentBg, 1);
            } else {
                drawFallbackBg();
            }
        }


    // 绘制滚动背景（单张图片循环滚动）
        function drawScrollingBg(img, alpha) {
            ctx.globalAlpha = alpha;
            const scale = GAME_HEIGHT / img.height;
            const drawWidth = img.width * scale;

            // ✅ 关键修复：使用取模确保无缝循环，避免浮点累积误差
            const normalizedOffset = ((bgOffset % drawWidth) + drawWidth) % drawWidth;

            let x = -normalizedOffset;
            while (x < GAME_WIDTH + drawWidth) {
                ctx.drawImage(img, 0, 0, img.width, img.height, x, 0, drawWidth, GAME_HEIGHT);
                x += drawWidth;
            }
            ctx.globalAlpha = 1;
        }
    function drawFallbackBg() {
        const gradient = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT * 0.6);
        gradient.addColorStop(0, COLORS.skyGradientTop);
        gradient.addColorStop(1, COLORS.skyGradientBottom);
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        drawSun(280, 80);
        drawClouds();
    }

        function drawCollectible(col) {
            ctx.save();
            ctx.translate(col.x, col.y);

            // 旋转动画
            const rotation = frameCount * 0.05;
            ctx.rotate(rotation);

            // 根据类型绘制不同素材
            switch(col.type) {
                case 'fengche':
                    if (collectibleAssets.fengche) {
                        const size = Math.max(col.width, col.height);
                        ctx.drawImage(collectibleAssets.fengche, -size/2, -size/2, size, size);
                    }
                    break;
                default:
                    // 兜底：如果素材没加载，不绘制
                    break;
            }

            ctx.restore();
        }

        // ===== 生成障碍物 =====
        // ===== 生成障碍物（素材版）=====
        function generateObstacle() {
            const now = Date.now();
            const adjustedGap = Math.max(800, minObstacleGap - distance * 0.5);

            if (now - lastObstacleTime < adjustedGap) return;

            // 随机选择障碍物类型
            const isPeacock = Math.random() > 0.5;

            const obs = {
                type: isPeacock ? 'peacock' : 'duck',
                x: GAME_WIDTH + 50,
                passed: false,
                animFrame: 0
            };

            if (isPeacock) {
                // 孔雀：在天上
                obs.y = GROUND_Y - 150 - Math.random() * 80;
                obs.width = 70;          // 绘制尺寸
                obs.height = 70;         // 绘制尺寸
                obs.hitboxX = 15;        // ← 碰撞箱左边距（居中缩小）
                obs.hitboxY = 15;        // ← 碰撞箱上边距
                obs.hitboxW = 40;        // ← 碰撞箱宽度（比绘制小）
                obs.hitboxH = 40;        // ← 碰撞箱高度
                obs.duckable = false;
            } else {
                // 鸭子：在地上
                obs.y = GROUND_Y - 65;      // 鸭子y轴位置   数值越小越往下
                obs.width = 80;
                obs.height = 100;
                obs.hitboxX = 15;          //数值越大越往右
                obs.hitboxY = 18;           // ← 如果鸭子往下移，碰撞箱也往下调,数值越大越往下
                obs.hitboxW = 45;
                obs.hitboxH = 40;
                obs.duckable = Math.random() > 0.7;
            }

            obstacles.push(obs);
            lastObstacleTime = now;
        }

            if (Math.random() > 0.03) return;

            const col = {
                type: 'fengche',           // ← 统一用素材类型名
                x: GAME_WIDTH + 30,
                y: GROUND_Y - 40 - Math.random() * 60,
                width: 35,                 // ← 游戏内显示尺寸
                height: 35,
                value: 50                  // ← 统一分值
            };

            collectibles.push(col);

        // ===== 碰撞检测 =====
        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }
        
        // ===== 游戏更新 =====
        function update(deltaTime) {

            if (gameState !== GameState.PLAYING || isDead) return;

            frameCount++;
            distance += gameSpeed * 0.1;
            
            // 速度递增
            gameSpeed = baseSpeed + Math.floor(distance / 100) * 0.15;            // 降低速度递增幅度,增幅减半
            gameSpeed = Math.min(gameSpeed, 8);                                   // 最高速度从15降到8
            
            // 更新玩家
            player.frameTimer++;
            if (player.frameTimer > 5) {
                player.runFrame++;
                player.frameTimer = 0;
            }
            
            // 跳跃物理
            if (player.isJumping) {
                player.velocityY += 0.12; // 重力          // 将重力从0.8改为0.40,重力减小，下落更慢，滞空时间更长
                player.y += player.velocityY;

                if (player.y >= GROUND_Y - PLAYER_GROUND_OFFSET) {  // ← 改成常量
                    player.y = GROUND_Y - PLAYER_GROUND_OFFSET;     // ← 改成常量
                    player.isJumping = false;
                    player.velocityY = 0;
                }
            }

            // 更新背景偏移
            // 更新背景偏移
            groundOffset = (groundOffset + gameSpeed) % 20;
            bgOffset1 = (bgOffset1 + gameSpeed * 0.3) % (GAME_WIDTH / 2);
            bgOffset2 = (bgOffset2 + gameSpeed * 0.5) % 200;
            bgOffset3 = (bgOffset3 + gameSpeed) % 500;
            // 背景图滚动偏移
            bgOffset += gameSpeed * 0.5;



            // 生成障碍物和收集物
            generateObstacle();
            generateCollectible();
            
            // 更新障碍物
            obstacles.forEach(obs => {
                obs.x -= gameSpeed;
            });
            obstacles = obstacles.filter(obs => obs.x > -100);
            
            // 更新收集物
            collectibles.forEach(col => {
                col.x -= gameSpeed;
            });
            collectibles = collectibles.filter(col => col.x > -50);

            // 玩家碰撞箱
            const playerBox = {
                x: player.x + 10,
                y: player.y + (player.isDucking ? 25 : 0),
                width: player.width - 20,
                height: player.height - (player.isDucking ? 30 : 10)
            };

            // // 调试：绘制玩家碰撞箱（蓝色边框）
            // ctx.strokeStyle = 'blue';
            // ctx.lineWidth = 2;
            // ctx.strokeRect(playerBox.x, playerBox.y, playerBox.width, playerBox.height);
            //



            // 注释该代码使小h无敌
            // 检测障碍物碰撞
            obstacles.forEach(obs => {
                const obsBox = {
                    x: obs.x + obs.hitboxX,
                    y: obs.y + obs.hitboxY,
                    width: obs.hitboxW,
                    height: obs.hitboxH
                };

                if (checkCollision(playerBox, obsBox)) {
                    if (obs.duckable && player.isDucking) {
                        return;
                    }
                    gameOver();
                }
            });
            // 注释该代码使小h无敌




            
            // 检测收集物碰撞
            collectibles.forEach((col, index) => {
                const colBox = {
                    x: col.x - col.width/2,
                    y: col.y - col.height/2,
                    width: col.width,
                    height: col.height
                };
                
                if (checkCollision(playerBox, colBox)) {
                    // 🆕 增加收集物计数（根据类型）
                    if (col.type === 'fengche') {
                        ingredientCount++;  // ← 风车计入食材/收集物
                    }


                // 🎵 播放收集音效
                    if (collectSound && sfxEnabled) {
                        collectSound.currentTime = 0;  // 重置到开头，支持连续快速播放
                        collectSound.volume = 0.6;      // 音量 60%
                        collectSound.play().catch(() => {});  // 捕获自动播放限制错误
                    }
                    
                    // 飘字粒子
                    particles.push({
                        x: col.x,
                        y: col.y,
                        text: `+${col.value}`,
                        color: COLORS.floatText,
                        size: 20,
                        life: 1,
                        vy: -2
                    });
                    
                    collectibles.splice(index, 1);
                }
            });
            
            // 更新粒子
            particles.forEach(p => {
                p.y += p.vy;
                p.life -= 0.02;
            });
            particles = particles.filter(p => p.life > 0);
        }

        // ===== 游戏结束 =====
        function gameOver() {
            isDead = true;
            if (bgmEnabled) bgm.pause();

            // 晕倒动画播放完再显示结束界面
            const deathAnim = () => {
                deathAnimFrame++;
                // 51帧，每2帧换一张，共102帧约1.7秒
                if (deathAnimFrame > 102) {
                    gameState = GameState.GAME_OVER;
                    showGameOver();
                } else {
                    requestAnimationFrame(deathAnim);
                }
            };
            deathAnim();
        }

        function showGameOver() {
            // 计算最终分数
            const distanceScore = Math.floor(distance) * 10;
            const collectScore = ingredientCount * 50;
            const finalScore = distanceScore + collectScore;
            const mushroomCount = Math.floor(finalScore / 1000);

            // 🍄 保存蘑菇数量到 localStorage，供主游戏读取
            // 如果已有记录，累加；否则新建
            const existingMushrooms = parseInt(localStorage.getItem('mushroomReward') || '0');
            const totalMushrooms = existingMushrooms + mushroomCount;
            localStorage.setItem('mushroomReward', totalMushrooms.toString());

            // 同时保存本次获得的蘑菇数（用于显示）
            localStorage.setItem('lastMushroomReward', mushroomCount.toString());
            localStorage.setItem('lastGameScore', finalScore.toString());

            // 显示结算信息
            document.getElementById('finalScore').textContent = `🏃 距离: ${Math.floor(distance)}m (+${distanceScore}分)`;
            document.getElementById('boneCount').textContent = `🍅 收集物: ${ingredientCount}个 (+${collectScore}分)`;
            document.getElementById('ingredientCount').textContent = `🎯 总分: ${finalScore}`;

            // 显示蘑菇奖励
            let mushroomDiv = document.getElementById('mushroomReward');
            if (!mushroomDiv) {
                mushroomDiv = document.createElement('div');
                mushroomDiv.id = 'mushroomReward';
                mushroomDiv.className = 'stats';
                mushroomDiv.style.color = '#FF6B6B';
                document.getElementById('gameOverScreen').insertBefore(mushroomDiv, document.getElementById('restartBtn'));
            }
            mushroomDiv.textContent = `🍄 获得蘑菇: ${mushroomCount}个 (累计: ${totalMushrooms}个)`;

            document.getElementById('restartBtn').textContent = '返回主菜单';
            document.getElementById('gameOverScreen').style.display = 'flex';
        }
        // ===== 绘制 =====
        function draw() {
            ctx.save();
            ctx.scale(scale, scale);
            
            // 清屏
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // 绘制背景层
            drawBackground();
            
            // 绘制地面
            drawGround();
            // 待机状态绘制小H
            if (gameState === GameState.START) {
                drawAnimatedDog(player.x, player.y, player.width, player.height, frameCount, false, false);
            }
            
            // 绘制收集物
            collectibles.forEach(col => drawCollectible(col));
            
            // 绘制障碍物
            obstacles.forEach(obs => drawObstacle(obs));
            
            // 绘制玩家
            //将drawPixelDog 改成 drawAnimatedDog,使用动画素材
            if (!isDead) {
                drawAnimatedDog(
                    player.x, 
                    player.y, 
                    player.width, 
                    player.height, 
                    player.runFrame,
                    player.isDucking,
                    false
                );
            } else {
                // 死亡动画 - 摔倒
                const rotation = Math.min(deathAnimFrame * 0.05, Math.PI/2);
                ctx.save();
                ctx.translate(player.x + player.width/2, player.y + player.height/2);
                ctx.rotate(rotation);
                drawAnimatedDog(-player.width/2, -player.height/2, player.width, player.height, 0, false, true);
                ctx.restore();
            }
            
            // 绘制粒子
            drawParticles();
            
            // HUD
            if (gameState === GameState.PLAYING) {
                drawHUD();
            }

            // 🆕 暂停幕布
            if (gameState === GameState.PAUSED) {
                drawPauseOverlay();
            }
            
            ctx.restore();
        }

        function drawHUD() {
            // 分数背景
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(10, 10, 140, 50);  // ← 高度从70改50，因为内容少了
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.fillRect(12, 12, 136, 46);

            // 距离
            ctx.fillStyle = '#333';
            ctx.font = 'bold 14px Courier New';
            ctx.fillText(`距离: ${Math.floor(distance)}m`, 20, 32);

            // 得分（风车 50分/个）
            ctx.fillStyle = '#333';
            ctx.fillText(`得分: ${ingredientCount * 50}`, 20, 52);  // ← 替换骨头和番茄

            // 速度指示器
            const speedLevel = Math.floor((gameSpeed - baseSpeed) / 0.5);
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(GAME_WIDTH - 60, 10, 50, 25);
            ctx.fillStyle = '#FF4444';
            ctx.font = 'bold 12px Courier New';
            ctx.fillText(`⚡ x${speedLevel + 1}`, GAME_WIDTH - 55, 28);
        }
        // ===== 输入处理 =====
        function handleInput(action) {
            if (gameState !== GameState.PLAYING || isDead) return;
            
            if (action === 'jump' && !player.isJumping) {
                player.isJumping = true;
                player.velocityY = -6                // 从-15改为-16跳得更高（负值越大跳得越高）,避免碰到第一个障碍物就坠机
                player.isDucking = false;
            } else if (action === 'duck') {
                player.isDucking = true;
            } else if (action === 'unduck') {
                player.isDucking = false;
            }
        }
        
        // 触摸事件
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const y = (touch.clientY - rect.top) / rect.height;
            
            if (gameState === GameState.PLAYING) {
                if (y < 0.5) {
                    handleInput('jump');
                } else {
                    handleInput('duck');
                }
            }
        }, { passive: false });
        
        canvas.addEventListener('touchend', (e) => {
            if (gameState === GameState.PLAYING) {
                handleInput('unduck');
            }
        });
        
        // 鼠标事件（桌面端）
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const y = (e.clientY - rect.top) / rect.height;
            
            if (gameState === GameState.PLAYING) {
                if (y < 0.5) {
                    handleInput('jump');
                } else {
                    handleInput('duck');
                }
            }
        });
        
        canvas.addEventListener('mouseup', () => {
            if (gameState === GameState.PLAYING) {
                handleInput('unduck');
            }
        });


        // 鼠标事件（桌面端）
        canvas.addEventListener('mousedown', (e) => {
            // 🆕 暂停状态下点击恢复游戏
            if (gameState === GameState.PAUSED) {
                togglePause();
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const y = (e.clientY - rect.top) / rect.height;

            if (gameState === GameState.PLAYING) {
                if (y < 0.5) {
                    handleInput('jump');
                } else {
                    handleInput('duck');
                }
            }
        });

        canvas.addEventListener('mouseup', () => {
            if (gameState === GameState.PLAYING) {
                handleInput('unduck');
            }
        });
        
        // 键盘事件
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                handleInput('jump');
            } else if (e.code === 'ArrowDown') {
                e.preventDefault();
                handleInput('duck');
            }
        });
        
        document.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowDown') {
                handleInput('unduck');
            }
        });
        
        // ===== 游戏循环 =====
        let lastTime = 0;

        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            if (gameState === GameState.PLAYING) {
                update(deltaTime);
            }
            draw();

            requestAnimationFrame(gameLoop);
        }
        
        // ===== 启动游戏 =====
        function startGame() {
            initGame();
            gameState = GameState.PLAYING;
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'block';
            document.getElementById('pauseBtn').textContent = '暂停';

            // 播放背景音乐（死亡后重新开始会从头播放）
            if (bgmEnabled) {
                bgm.volume = 0.3;
                bgm.currentTime = 0;
                bgm.play().catch(() => {});
            }
        }

        // 🆕 新增：返回主菜单
        function backToMenu() {
            gameState = GameState.START;
            document.getElementById('gameOverScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'flex';
            document.getElementById('pauseBtn').style.display = 'none';

            // 停止背景音乐
            bgm.pause();
            bgm.currentTime = 0;

            // 重置游戏数据（可选，保持显示待机画面）
            initGame();
        }


// ===== 暂停游戏 =====
        function togglePause() {
            if (gameState === GameState.PLAYING) {
                gameState = GameState.PAUSED;
                document.getElementById('pauseBtn').textContent = '继续';
                if (bgmEnabled) bgm.pause();
            } else if (gameState === GameState.PAUSED) {
                gameState = GameState.PLAYING;
                document.getElementById('pauseBtn').textContent = '暂停';
                if (bgmEnabled) bgm.play().catch(() => {});
            }
        }


        // ===== 设置界面 =====
        function showSettings() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('settingsScreen').style.display = 'flex';
            updateToggleButtons();
        }

        function hideSettings() {
            document.getElementById('settingsScreen').style.display = 'none';
            document.getElementById('startScreen').style.display = 'flex';
        }

        function updateToggleButtons() {
            const bgmBtn = document.getElementById('bgmToggle');
            const sfxBtn = document.getElementById('sfxToggle');

            bgmBtn.textContent = bgmEnabled ? '开启' : '关闭';
            bgmBtn.style.background = bgmEnabled
                ? 'linear-gradient(180deg, #4CAF50, #45a049)'
                : 'linear-gradient(180deg, #666, #555)';

            sfxBtn.textContent = sfxEnabled ? '开启' : '关闭';
            sfxBtn.style.background = sfxEnabled
                ? 'linear-gradient(180deg, #4CAF50, #45a049)'
                : 'linear-gradient(180deg, #666, #555)';
        }

        function toggleBGM() {
            bgmEnabled = !bgmEnabled;
            updateToggleButtons();

            if (!bgmEnabled) {
                bgm.pause();
            } else if (gameState === GameState.PLAYING) {
                bgm.play().catch(() => {});
            }
        }

        function toggleSFX() {
            sfxEnabled = !sfxEnabled;
            updateToggleButtons();
        }


        // ===== 绘制暂停幕布 =====
        function drawPauseOverlay() {
            // 半透明黑色幕布
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // "已暂停" 文字
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 36px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('已暂停', GAME_WIDTH / 2, GAME_HEIGHT / 2 - 20);

            // 提示文字
            ctx.fillStyle = '#CCCCCC';
            ctx.font = '16px "Courier New", monospace';
            ctx.fillText('点击屏幕继续', GAME_WIDTH / 2, GAME_HEIGHT / 2 + 25);

            // 重置文字对齐
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        }


        // 按钮事件
        document.getElementById('pauseBtn').addEventListener('click', togglePause);

        // 键盘暂停（按 P 键）
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyP') {
                e.preventDefault();
                togglePause();
            }
        });
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('startBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            startGame();
        });

// 原来的重新开始按钮现在改为返回主菜单
        document.getElementById('restartBtn').addEventListener('click', backToMenu);
        document.getElementById('restartBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            backToMenu();
        });

// 游戏结束屏幕点击也返回主菜单
        document.getElementById('gameOverScreen').addEventListener('click', (e) => {
            if (e.target === document.getElementById('gameOverScreen') || e.target.id === 'restartBtn') {
                return; // 让按钮自己的事件处理
            }
            // 点击空白处也返回主菜单
            backToMenu();
        });


        // 设置按钮事件
        document.getElementById('settingsBtn').addEventListener('click', showSettings);
        document.getElementById('settingsBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            showSettings();
        });

        // 返回庭院按钮
        document.getElementById('backToCourtyardBtn').addEventListener('click', () => {
            if (gameState === GameState.GAME_OVER && typeof finalScore !== 'undefined') {
                // 数据已在 showGameOver 中保存，直接跳转
            }
            window.location.assign('../index.html');
        });
        document.getElementById('backToCourtyardBtn').addEventListener('touchend', (e) => {
            if (gameState === GameState.GAME_OVER && typeof finalScore !== 'undefined') {
                // 数据已在 showGameOver 中保存，直接跳转
            }
            e.preventDefault();
            window.location.assign('../index.html');
        });

        document.getElementById('backBtn').addEventListener('click', hideSettings);
        document.getElementById('backBtn').addEventListener('touchend', (e) => {
            e.preventDefault();
            hideSettings();
        });

        document.getElementById('bgmToggle').addEventListener('click', toggleBGM);
        document.getElementById('sfxToggle').addEventListener('click', toggleSFX);
        
        // 初始渲染
        initGame();
        requestAnimationFrame(gameLoop);
        
    })();
    </script>
